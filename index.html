<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #131b30;
    --bg-deep: #0c1223;
    --paper: #f2ead9;
    --paper-dim: #aab2c8;
    --brass: #c6a059;
    --line: rgba(198,160,89,0.25);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--paper);
  }

  body{
    font-family: 'Work Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 6vw;
    position: relative;
    overflow: hidden;
  }

  main{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 560px;
  }

  h1{
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 11vw, 6.5rem);
    letter-spacing: 0.14em;
    margin: 0;
    padding-left: 0.14em; /* balance the trailing tracking */
    line-height: 1;
    color: var(--brass);
  }

  .links{
    display: flex;
    gap: 2.2rem;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    margin-top: 3.4rem;
  }

  .links a{
    color: var(--paper-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .links a:hover,
  .links a:focus-visible{
    color: var(--brass);
    border-color: var(--brass);
  }

  .links a:focus-visible{
    outline: 2px solid var(--brass);
    outline-offset: 4px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: no-preference){
    main{
      animation: rise 0.9s ease-out;
    }
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <main>
    <h1>WAIN</h1>
    <div class="links">
      <a href="https://instagram.com/wain.studio" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:hello@wain.studio">hello@wain.studio</a>
    </div>
  </main>

</body>
</html>
